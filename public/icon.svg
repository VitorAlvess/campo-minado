<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="bomb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <!-- Fundo com bordas arredondadas padrão iOS (squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Grid sutil de fundo estilo campo minado -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="4">
    <line x1="128" y1="64" x2="128" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="384" y1="64" x2="384" y2="448"/>
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="384" x2="448" y2="384"/>
  </g>
  
  <!-- Corpo da Mina -->
  <circle cx="256" cy="270" r="110" fill="url(#bomb)"/>
  <circle cx="256" cy="270" r="106" fill="none" stroke="#64748b" stroke-width="6"/>
  <circle cx="220" cy="230" r="28" fill="#94a3b8" opacity="0.3"/>
  
  <!-- Espinhos da Mina -->
  <rect x="246" y="130" width="20" height="36" rx="6" fill="#64748b"/>
  <rect x="246" y="374" width="20" height="36" rx="6" fill="#64748b"/>
  <rect x="116" y="260" width="36" height="20" rx="6" fill="#64748b"/>
  <rect x="360" y="260" width="36" height="20" rx="6" fill="#64748b"/>
  
  <g transform="rotate(45 256 270)">
    <rect x="246" y="130" width="20" height="36" rx="6" fill="#64748b"/>
    <rect x="246" y="374" width="20" height="36" rx="6" fill="#64748b"/>
    <rect x="116" y="260" width="36" height="20" rx="6" fill="#64748b"/>
    <rect x="360" y="260" width="36" height="20" rx="6" fill="#64748b"/>
  </g>
  
  <!-- Bandeira vermelha em destaque sobreposta -->
  <g transform="translate(190, 160) scale(1.1)">
    <!-- Haste -->
    <rect x="74" y="30" width="10" height="150" rx="4" fill="#f8fafc"/>
    <path d="M60 180 L98 180 L88 170 L70 170 Z" fill="#94a3b8"/>
    <!-- Flâmula -->
    <path d="M84 40 L160 75 L84 110 Z" fill="url(#accent)"/>
  </g>
</svg>

