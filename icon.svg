  <rect x="256" y="0" width="256" height="256" fill="#a2d149"/>
  <rect x="0" y="256" width="256" height="256" fill="#a2d149"/>
  <rect x="256" y="256" width="256" height="256" fill="#aad751"/>

  <!-- Sombra na base da bandeira -->
